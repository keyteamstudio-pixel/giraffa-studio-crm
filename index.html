<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Giraffa Studio — CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#faf6ef;--cream:#f1e8d8;--sand:#ece1cd;--card:#fff;
  --ink:#1a1710;--txt:#2c2820;--soft:#6b6457;--faint:#9a9284;
  --terra:#d2552e;--terra-deep:#a83f1f;--terra-soft:rgba(210,85,46,.1);
  --green:#3f7d55;--green-soft:rgba(63,125,85,.12);
  --amber:#b8801f;--amber-soft:rgba(184,128,31,.14);
  --red:#b23a2f;--red-soft:rgba(178,58,47,.12);
  --blue:#3a6ea8;--blue-soft:rgba(58,110,168,.12);
  --line:rgba(26,23,16,.14);--line-soft:rgba(26,23,16,.07);
  --radius:12px;--ffd:"Fraunces",Georgia,serif;--ffb:"Inter",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ffb);background:var(--paper);color:var(--txt);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
.hide{display:none!important}

/* ---------- login ---------- */
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.authcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:34px 32px;max-width:400px;width:100%}
.authcard .brandmark{font-family:var(--ffd);font-size:1.7rem;font-weight:500;color:var(--ink);line-height:1}
.authcard .brandmark small{display:block;font-family:var(--ffb);font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--terra);margin-top:6px}
.authcard h2{font-family:var(--ffd);font-weight:500;font-size:1.2rem;color:var(--ink);margin:22px 0 4px}
.authcard p{color:var(--soft);font-size:.9rem;margin-bottom:18px}
.err{color:var(--red);font-size:.85rem;margin:8px 0}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--ink);color:#f3ecdd;padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-family:var(--ffd);font-size:1.35rem;font-weight:500;color:#fff;line-height:1;padding:0 8px}
.brand small{display:block;font-family:var(--ffb);font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:var(--terra);margin-top:5px}
.navgroup{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(243,236,221,.4);padding:16px 10px 6px}
.nav{margin-top:14px;display:flex;flex-direction:column;gap:2px}
.nav button{background:none;border:0;color:rgba(243,236,221,.82);font:inherit;font-size:.9rem;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:var(--terra);color:#fff}
.nav .cnt{font-size:.7rem;opacity:.7;font-variant-numeric:tabular-nums}
.sidefoot{margin-top:auto;padding:16px 10px 0;border-top:1px solid rgba(255,255,255,.1);font-size:.78rem;color:rgba(243,236,221,.55)}
.sidefoot b{display:block;color:#fff;font-weight:500;font-size:.85rem}
.linkbtn{background:none;border:1px solid rgba(255,255,255,.2);color:rgba(243,236,221,.75);font:inherit;font-size:.75rem;padding:5px 12px;border-radius:99px;cursor:pointer;margin-top:10px}
.linkbtn:hover{border-color:var(--terra);color:#fff}

.main{padding:30px 34px 60px;max-width:1500px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px;flex-wrap:wrap}
h1{font-family:var(--ffd);font-weight:500;font-size:1.85rem;color:var(--ink);line-height:1.15}
h1 .sub{display:block;font-family:var(--ffb);font-size:.85rem;color:var(--soft);font-weight:400;margin-top:4px}
h2{font-family:var(--ffd);font-weight:500;font-size:1.12rem;color:var(--ink)}
h3{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- atoms ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px}
.card + .card{margin-top:16px}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g32{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
@media(max-width:1150px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g23,.g32{grid-template-columns:1fr}}
@media(max-width:820px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:column}.main{padding:22px 16px 50px}.g2,.g4{grid-template-columns:1fr}}

.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.kpi .v{font-family:var(--ffd);font-size:1.75rem;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.72rem;color:var(--soft);margin-top:5px}
.kpi .d{font-size:.72rem;margin-top:6px;color:var(--faint)}

.btn{background:var(--terra);color:#fff;border:0;border-radius:99px;padding:8px 16px;font:inherit;font-size:.84rem;font-weight:500;cursor:pointer}
.btn:hover{background:var(--terra-deep)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--cream);border-color:var(--terra)}
.btn.sm{padding:5px 12px;font-size:.78rem}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--red-soft)}
.lnk{background:none;border:0;color:var(--terra);font:inherit;font-size:inherit;cursor:pointer;padding:0;text-align:left}
.lnk:hover{color:var(--terra-deep);text-decoration:underline}

.badge{display:inline-block;font-size:.68rem;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--sand);color:var(--txt);white-space:nowrap}
.b-green{background:var(--green-soft);color:var(--green)}
.b-amber{background:var(--amber-soft);color:var(--amber)}
.b-red{background:var(--red-soft);color:var(--red)}
.b-blue{background:var(--blue-soft);color:var(--blue)}
.b-terra{background:var(--terra-soft);color:var(--terra-deep)}
.chip{display:inline-block;font-size:.72rem;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--soft);margin:2px 4px 2px 0}

table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:0 10px 8px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:rgba(236,225,205,.32)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--soft)}
.faint{color:var(--faint);font-size:.8rem}
.empty{color:var(--faint);font-size:.88rem;padding:18px 2px}

.field{margin-bottom:14px}
label{display:block;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:5px}
input,select,textarea{width:100%;font:inherit;font-size:.9rem;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--terra)}
textarea{min-height:78px;resize:vertical}
.inline{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.inline .field{margin-bottom:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:8px;font-size:.86rem}
.check input{width:auto}

.prog{height:6px;border-radius:99px;background:var(--sand);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--terra);border-radius:99px}
.prog i.ok{background:var(--green)}
.prog i.warn{background:var(--amber)}
.prog i.bad{background:var(--red)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;font:inherit;font-size:.88rem;color:var(--soft);padding:9px 14px;cursor:pointer;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--terra-deep);border-bottom-color:var(--terra);font-weight:500}

.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:1000px){.kanban{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.kanban{grid-template-columns:1fr}}
.kcol{background:var(--cream);border-radius:var(--radius);padding:12px}
.kcol h3{margin-bottom:10px;display:flex;justify-content:space-between}
.tsk{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px;font-size:.85rem;cursor:pointer}
.tsk:hover{border-color:var(--terra)}
.tsk .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:7px;font-size:.72rem;color:var(--faint)}

.timeline{list-style:none;border-left:2px solid var(--line);padding-left:16px;margin-left:4px}
.timeline li{margin-bottom:14px;position:relative}
.timeline li:before{content:"";position:absolute;left:-21px;top:6px;width:8px;height:8px;border-radius:99px;background:var(--terra)}
.timeline .when{font-size:.72rem;color:var(--faint)}

.modal{position:fixed;inset:0;background:rgba(26,23,16,.42);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;z-index:50}
.modal .box{background:var(--card);border-radius:16px;padding:26px 28px;max-width:520px;width:100%}
.modal .box.wide{max-width:820px}
.modal h2{margin-bottom:16px}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:.86rem;z-index:80;box-shadow:0 8px 26px rgba(26,23,16,.25);animation:up .25s ease}
.toast.err{background:var(--red)}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.gantt{margin-top:20px}
.grow{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;margin-bottom:8px}
.glab{font-size:.82rem;color:var(--soft)}
.gtrack{position:relative;height:16px;background:var(--sand);border-radius:99px}
.gbar{position:absolute;top:0;height:16px;border-radius:99px;background:var(--terra);overflow:hidden;min-width:8px}
.gbar.ok{background:var(--green)}
.gbar.soft{background:rgba(26,23,16,.2)}
.gbar i{display:block;height:100%;background:rgba(255,255,255,.5)}
@media(max-width:640px){.grow{grid-template-columns:96px 1fr}}

.bars{display:flex;flex-direction:column;gap:10px}
.barrow{display:grid;grid-template-columns:150px 1fr 84px;gap:10px;align-items:center;font-size:.85rem}
.barrow .track{height:9px;background:var(--sand);border-radius:99px;overflow:hidden}
.barrow .track i{display:block;height:100%;background:var(--terra);border-radius:99px}
@media(max-width:640px){.barrow{grid-template-columns:110px 1fr 70px;font-size:.8rem}}

@media print{
  body{background:#fff}
  .side,.tools,.tabs,.btn,.lnk,.noprint{display:none!important}
  .app{display:block}.main{padding:0;max-width:none}
  .card{border:0;padding:0}
}
</style>
</head>
<body>

<div id="setup" class="center hide">
  <div class="authcard">
    <div class="brandmark">Giraffa<small>Studio · CRM</small></div>
    <h2>Configurazione mancante</h2>
    <p>Manca la configurazione Supabase in <code>config.js</code>.</p>
  </div>
</div>

<div id="login" class="center hide">
  <form class="authcard" id="loginform">
    <div class="brandmark">Giraffa<small>Studio · CRM</small></div>
    <h2>Accedi</h2>
    <p>Area riservata ai membri dello studio.</p>
    <div class="field"><label>Email</label><input type="email" name="email" required autocomplete="username" /></div>
    <div class="field"><label>Password</label><input type="password" name="password" required autocomplete="current-password" /></div>
    <div class="err hide" id="loginerr"></div>
    <button class="btn" style="width:100%" type="submit">Entra</button>
  </form>
</div>

<div id="app" class="app hide">
  <aside class="side">
    <div class="brand">Giraffa<small>Studio · CRM</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">
      <b id="mename">—</b>
      <span id="meemail"></span>
      <button class="linkbtn" id="logout">Esci</button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div id="modal"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

</body>
</html>
