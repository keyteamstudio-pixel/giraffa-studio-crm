@media (prefers-color-scheme: dark){
  :root{
    --paper:#0e0d0b;--cream:#191713;--sand:#2a2622;
    --card:#171512;--ink:#f6f2e9;--txt:#e2dbcd;--soft:#a49b8d;--faint:#7a7264;
    --terra:#ff7a3a;--terra-deep:#ff9866;--terra-soft:rgba(255,122,58,.15);
    --green:#63b183;--green-soft:rgba(99,177,131,.15);
    --amber:#d9a244;--amber-soft:rgba(217,162,68,.15);
    --red:#e0705f;--red-soft:rgba(224,112,95,.15);
    --blue:#7aa8dd;--blue-soft:rgba(122,168,221,.15);
    --line:rgba(255,255,255,.1);--line-soft:rgba(255,255,255,.055);
    --glass:rgba(24,22,19,.72);
    --sh-1:0 1px 2px rgba(0,0,0,.4);
    --sh-2:0 1px 3px rgba(0,0,0,.35), 0 10px 30px -12px rgba(0,0,0,.6);
    --sh-3:0 24px 70px -20px rgba(0,0,0,.8), 0 2px 6px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);color:var(--txt);font-family:var(--ffb);
  font-size:15px;line-height:1.5;letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  min-height:100vh;position:relative;overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:-30vh -20vw auto -20vw;height:90vh;z-index:0;pointer-events:none;
  background:
    radial-gradient(45vw 45vh at 18% 12%, rgba(255,102,26,.10), transparent 65%),
    radial-gradient(40vw 40vh at 82% 0%, rgba(58,110,168,.08), transparent 62%);
  filter:blur(20px);
}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
.hide{display:none!important}
::selection{background:var(--terra-soft)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:rgba(120,110,95,.28);border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(120,110,95,.5);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- login ---------- */
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;z-index:1}
.authcard{
  background:var(--card);border:1px solid var(--line);border-radius:26px;padding:40px 38px;max-width:410px;width:100%;
  box-shadow:var(--sh-3);animation:pop .5s var(--ease);
}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.authcard .brandmark{display:flex;align-items:center}
.authcard .brandmark .mark{height:54px}
.authcard h2{font-size:1.32rem;font-weight:600;letter-spacing:-.02em;color:var(--ink);margin:30px 0 5px}
.authcard p{color:var(--soft);font-size:.92rem;margin-bottom:22px}
.err{color:var(--red);font-size:.86rem;margin:10px 0}

/* ---------- marchio ---------- */
.mark{display:block;flex:0 0 auto;height:28px;aspect-ratio:113/128;background:var(--terra);
  -webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh;position:relative;z-index:1}
.side{
  padding:24px 14px 20px;display:flex;flex-direction:column;gap:2px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
  border-right:1px solid var(--line);
}
.brand{display:flex;align-items:center;padding:2px 12px 4px}
.brand .mark{height:34px}
.navgroup{font-size:.66rem;font-weight:600;letter-spacing:.06em;color:var(--faint);padding:20px 12px 7px}
.nav{margin-top:18px;display:flex;flex-direction:column;gap:1px}
.nav button{
  background:none;border:0;color:var(--txt);font:inherit;font-size:.925rem;font-weight:450;
  text-align:left;padding:8px 11px;border-radius:9px;cursor:pointer;
  display:flex;align-items:center;gap:11px;width:100%;
  transition:background .16s var(--ease),color .16s var(--ease);
}
.nav button::before{
  content:"";width:17px;height:17px;flex:0 0 auto;background:currentColor;opacity:.62;
  -webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;
  -webkit-mask-image:var(--i);mask-image:var(--i);
}
.nav button:hover{background:rgba(120,110,95,.09)}
.nav button.on{background:var(--terra);color:#fff;box-shadow:0 1px 2px rgba(255,102,26,.4)}
.nav button.on::before{opacity:1}
.nav .cnt{margin-left:auto;font-size:.75rem;font-weight:500;opacity:.55;font-variant-numeric:tabular-nums}
.nav button.on .cnt{opacity:.85}

.sidefoot{margin-top:auto;padding:16px 11px 0;border-top:1px solid var(--line);font-size:.78rem;color:var(--faint)}
.sidefoot b{display:block;color:var(--ink);font-weight:600;font-size:.9rem;letter-spacing:-.01em;margin-bottom:3px}
.linkbtn{background:none;border:1px solid var(--line);color:var(--soft);font:inherit;font-size:.76rem;font-weight:500;padding:5px 13px;border-radius:99px;cursor:pointer;margin-top:12px;transition:all .16s var(--ease)}
.linkbtn:hover{border-color:var(--terra);color:var(--terra);background:var(--terra-soft)}

.main{padding:38px 40px 90px;max-width:1560px;margin:0 auto;width:100%}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.main > *{animation:rise .5s var(--ease) both}
.main > *:nth-child(1){animation-delay:0s}
.main > *:nth-child(2){animation-delay:.05s}
.main > *:nth-child(3){animation-delay:.1s}
.main > *:nth-child(4){animation-delay:.15s}
.main > *:nth-child(5){animation-delay:.2s}
.main > *:nth-child(n+6){animation-delay:.25s}
.grid > *{animation:rise .55s var(--ease) both}
.grid > *:nth-child(2){animation-delay:.06s}
.grid > *:nth-child(3){animation-delay:.12s}
.grid > *:nth-child(4){animation-delay:.18s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:22px;margin-bottom:28px;flex-wrap:wrap}
h1{font-size:2.05rem;font-weight:600;letter-spacing:-.032em;color:var(--ink);line-height:1.1}
h1 .sub{display:block;font-size:.93rem;color:var(--soft);font-weight:400;letter-spacing:-.01em;margin-top:7px}
h2{font-size:1.02rem;font-weight:600;letter-spacing:-.018em;color:var(--ink)}
h3{font-size:.72rem;letter-spacing:.02em;color:var(--faint);font-weight:600;text-transform:none}
.tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap}

/* ---------- superfici ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:24px 26px;box-shadow:var(--sh-2)}
.card + .card{margin-top:18px}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g32{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g23,.g32{grid-template-columns:1fr}}

.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:20px 22px;box-shadow:var(--sh-1);transition:transform .2s var(--ease),box-shadow .2s var(--ease);display:flex;flex-direction:column;min-height:124px}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.kpi .v{font-size:2rem;font-weight:600;letter-spacing:-.035em;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums;min-height:34px;display:flex;align-items:center}
.kpi .l{font-size:.8rem;color:var(--soft);margin-top:auto;padding-top:10px;font-weight:450}
.kpi .d{font-size:.76rem;margin-top:4px;color:var(--faint);line-height:1.35}

/* ---------- controlli ---------- */
.btn{
  background:var(--terra);color:#fff;border:0;border-radius:99px;padding:9px 18px;
  font:inherit;font-size:.875rem;font-weight:500;letter-spacing:-.01em;cursor:pointer;
  box-shadow:0 1px 2px rgba(255,102,26,.35);transition:transform .15s var(--ease),background .15s var(--ease),box-shadow .15s var(--ease);
}

table{width:100%;border-collapse:collapse;font-size:.9rem}

input:focus,select:focus,textarea:focus{outline:0;border-color:var(--terra);box-shadow:0 0 0 3.5px var(--terra-soft)}

.inline{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}

.prog{height:7px;border-radius:99px;background:var(--sand);overflow:hidden;margin-top:7px}

.tabs{display:flex;gap:3px;margin-bottom:22px;flex-wrap:wrap;background:var(--cream);padding:4px;border-radius:13px}

.kcol{background:var(--cream);border-radius:var(--r-m);padding:14px}

.modal{position:fixed;inset:0;background:rgba(22,19,14,.36);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:flex;align-items:flex-start;justify-content:center;padding:48px 20px;overflow-y:auto;z-index:50;animation:fade .22s var(--ease)}

.bars{display:flex;flex-direction:column;gap:12px}

/* ---------- avatar, anelli, grafici ---------- */
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:99px;color:#fff;font-weight:600;letter-spacing:-.02em;box-shadow:0 0 0 2px var(--card);vertical-align:middle}

.crow{display:flex;align-items:center;gap:16px;width:100%;background:none;border:0;border-radius:14px;padding:12px 10px;cursor:pointer;text-align:left;font:inherit;transition:background .15s var(--ease)}

.cmeta{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.mini{font-size:.76rem;opacity:0;transition:opacity .15s}
.cri:hover .mini{opacity:1}
.qadd{display:flex;align-items:center;gap:11px;padding:9px 4px}
.qadd input{border:0;background:none;padding:0;font-size:.93rem}
.qadd input:focus{box-shadow:none}

/* ---------- timesheet ---------- */
.wknav{display:flex;align-items:center;gap:9px}
.tswrap{overflow-x:auto}
table.ts{min-width:660px}
table.ts th{padding-bottom:8px}
table.ts th.oggi{color:var(--terra)}
table.ts td{padding:8px 6px}
table.ts td:first-child{min-width:210px}
.tsc{width:62px;text-align:right;padding:7px 9px;font-variant-numeric:tabular-nums;border-radius:9px;background:transparent;border-color:transparent}
.tsc:hover{border-color:var(--line);background:var(--card)}
.tsc:focus{background:var(--card)}
.tsc.oggi{background:var(--terra-soft)}
.tsr{font-variant-numeric:tabular-nums;color:var(--soft)}

/* ---------- progetti e lavorazioni ---------- */
.pcard{cursor:pointer;transition:transform .16s var(--ease),box-shadow .16s var(--ease)}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--sh-2)}
.pfoot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line-soft);padding-top:12px}
.pfoot b{color:var(--ink);font-variant-numeric:tabular-nums}
.lav{border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px}
.lavtop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.lavtop b{color:var(--ink);font-weight:600}
.lavbar{display:flex;align-items:center;gap:12px;margin:10px 0}
.lavbar .prog{flex:1;margin-top:0}
.lavact{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lavact > span:last-child{display:flex;gap:7px;flex-wrap:wrap}

/* ---------- calendario ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.caldow{font-size:.7rem;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding-bottom:2px}
.calday{min-height:106px;border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;transition:all .15s var(--ease);display:flex;flex-direction:column;gap:4px}
.calday:hover{border-color:var(--terra)}
.calday.out{opacity:.38}
.calday.today{border-color:var(--terra);box-shadow:0 0 0 1px var(--terra)}
.caltop{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;color:var(--soft)}
.calday.today .caltop{color:var(--terra-deep);font-weight:700}
.calore{font-size:.68rem;background:var(--cream);border-radius:99px;padding:1px 7px;color:var(--soft)}
.calev{font-size:.72rem;padding:3px 7px;border-radius:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.calev:hover{filter:brightness(.95)}
@media(max-width:900px){.cal{gap:5px}.calday{min-height:76px;padding:6px}.calev{font-size:.64rem;padding:2px 5px}.caldow{font-size:.6rem}}

/* ---------- preventivo ---------- */
.pgroup{border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.pgroup.opz{background:var(--cream);border-style:dashed}
.pghead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap;font-size:.92rem}
.pghead b{color:var(--ink);font-weight:600}
.pghead > div{display:flex;align-items:center;gap:8px}
.mini2{font-size:.76rem}
.totali{max-width:440px;margin-left:auto;margin-top:20px;border-top:2px solid var(--line);padding-top:4px}
.totali td{padding:7px 2px;border-bottom:0}
@media(max-width:900px){.totali{max-width:none}}

/* ---------- timer ---------- */
.timerchip{display:flex;align-items:center;gap:10px;width:100%;background:var(--terra-soft);border:1px solid rgba(255,102,26,.28);border-radius:12px;padding:9px 11px;cursor:pointer;font:inherit;text-align:left;margin-bottom:6px;transition:all .16s var(--ease)}
.timerchip:hover{background:rgba(255,102,26,.16)}
.timerchip .tc{display:flex;flex-direction:column;min-width:0;flex:1}
.timerchip .tc b{font-size:.83rem;font-weight:550;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timerchip .tc span{font-size:.76rem;color:var(--terra-deep);font-variant-numeric:tabular-nums}
.timerchip .stopi{color:var(--terra);font-size:.7rem}
.pulse{width:9px;height:9px;border-radius:99px;background:var(--terra);flex:0 0 auto;animation:pl 1.8s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.82)}}
.btn.stop{background:var(--ink)}
.btn.stop:hover{background:#000}

/* ---------- barra mobile ---------- */
.topbar{display:none}
.scrim{display:none}
@media(max-width:900px){
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:40;padding:10px 12px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
  .tbrand{display:flex;align-items:center}
  .tbrand .mark{height:26px}
  .ham{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .app{display:block}
  .side{position:fixed;top:0;left:0;bottom:0;width:272px;transform:translateX(-101%);transition:transform .32s var(--ease);z-index:60;padding-top:20px}
  body.navopen .side{transform:none;box-shadow:var(--sh-3)}
  .scrim{display:block;position:fixed;inset:0;background:rgba(22,19,14,.42);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s var(--ease);z-index:50}
  body.navopen .scrim{opacity:1;pointer-events:auto}
  .main{padding:20px 15px 90px}
  h1{font-size:1.6rem}
  h1 .sub{font-size:.86rem}
  .top{gap:14px;margin-bottom:20px;align-items:flex-start}
  .tools{width:100%;flex-wrap:nowrap;overflow-x:auto;gap:8px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .tools .btn,.tools input,.tools select{flex:0 0 auto;white-space:nowrap;width:auto}
  .tools .faint{flex:0 0 auto}
  .tools .btn[data-pal]{display:none}
  .card{padding:20px 17px;border-radius:18px}
  .g2,.g3,.g4,.g23,.g32,.expgrid,.steps,.board{grid-template-columns:1fr!important}
  .card > table{white-space:nowrap}
  .seg{margin-left:0;width:100%}
  .seg button{flex:1}
  .filters{gap:10px}
  .chips{width:100%;overflow-x:auto;padding-bottom:2px;flex-wrap:nowrap}
  .fc{white-space:nowrap}
  .modal{padding:0;align-items:flex-end}
  .modal .box{border-radius:26px 26px 0 0;max-width:none!important;max-height:92vh;overflow-y:auto;padding:26px 20px 34px;animation:sheet .34s var(--ease)}
  @keyframes sheet{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
  .pal{padding:0!important}
  .toast{left:15px;right:15px;bottom:15px;transform:none;text-align:center}
  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .crow{flex-wrap:wrap;gap:12px}
  .cval{margin-left:auto}
  .barrow{grid-template-columns:1fr auto;gap:6px}
  .barrow .track{grid-column:1/-1;order:3}
  .grow{grid-template-columns:1fr}
  .glab{margin-bottom:3px}
  .heat{gap:3px}.hcol{gap:3px}.hc{width:13px;height:13px}
}
@media(max-width:480px){
  h1{font-size:1.42rem}
  .kpi{min-height:104px;padding:16px 18px}
  .kpi .v{font-size:1.72rem}
  .main{padding:16px 12px 80px}
}

@media print{
  body{background:#fff}body::before{display:none}
  .side,.tools,.tabs,.btn,.lnk,.noprint{display:none!important}
  .app{display:block}.main{padding:0;max-width:none}
  .card{border:0;padding:0;box-shadow:none}
}
</style>
</head>
