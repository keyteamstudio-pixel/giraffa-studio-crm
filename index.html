<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Giraffa Studio — CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf6ef;--cream:#f1e8d8;--sand:#ece1cd;--card:#fff;
    --ink:#1a1710;--txt:#2c2820;--soft:#6b6457;
    --terra:#d2552e;--terra-deep:#a83f1f;--terra-soft:rgba(210,85,46,.1);
    --line:rgba(26,23,16,.14);--radius:12px;
    --ffd:"Fraunces",Georgia,serif;--ffb:"Inter",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--ffb);background:var(--paper);color:var(--txt);line-height:1.5;-webkit-font-smoothing:antialiased}
  .hide{display:none!important}
  .center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .authcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:34px 32px;max-width:400px;width:100%}
  .authcard .brand{font-family:var(--ffd);font-size:1.7rem;font-weight:500;color:var(--ink);line-height:1}
  .authcard .brand small{display:block;font-family:var(--ffb);font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--terra);margin-top:6px}
  .authcard h2{font-family:var(--ffd);font-weight:500;font-size:1.2rem;color:var(--ink);margin:22px 0 4px}
  .authcard p{color:var(--soft);font-size:.9rem;margin-bottom:18px}
  .field{margin-bottom:14px}
  .err{color:#b23;font-size:.85rem;margin:8px 0}
  .app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
  .side{background:var(--ink);color:#f3ecdd;padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
  .brand{font-family:var(--ffd);font-size:1.35rem;font-weight:500;color:#fff;line-height:1}
  .brand small{display:block;font-family:var(--ffb);font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--terra);margin-top:5px}
  .nav{margin-top:18px;display:flex;flex-direction:column;gap:2px}
  .nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:#cfc7b6;font:inherit;font-size:.92rem;padding:9px 12px;border-radius:9px;cursor:pointer}
  .nav button:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav button.on{background:var(--terra);color:#fff}
  .side-foot{margin-top:auto;font-size:.72rem;color:#8a8474;line-height:1.5}
  .side-foot button{color:#cfc7b6;background:none;border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:6px 10px;font:inherit;font-size:.78rem;cursor:pointer;margin-top:8px}
  .side-foot button:hover{background:rgba(255,255,255,.08);color:#fff}
  .main{padding:clamp(18px,3vw,36px);max-width:1180px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .top h1{font-family:var(--ffd);font-weight:500;font-size:clamp(1.5rem,3vw,2rem);color:var(--ink);letter-spacing:-.01em}
  .top .tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  select,input,textarea{font:inherit;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
  .tools select{width:auto}
  select:focus,input:focus,textarea:focus{outline:2px solid var(--terra);outline-offset:1px}
  label{display:block;font-size:.75rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--soft);margin:0 0 5px}
  .btn{display:inline-flex;align-items:center;gap:7px;font:inherit;font-weight:500;font-size:.9rem;padding:9px 16px;border-radius:100px;border:1px solid var(--ink);background:none;color:var(--ink);cursor:pointer;white-space:nowrap}
  .btn:hover{background:var(--ink);color:#fff}
  .btn.pri{background:var(--terra);border-color:var(--terra);color:#fff}
  .btn.pri:hover{background:var(--terra-deep);border-color:var(--terra-deep)}
  .btn.sm{padding:6px 12px;font-size:.82rem}
  .btn.ghost{border-color:var(--line);color:var(--soft)}
  .btn.ghost:hover{background:var(--sand);color:var(--ink)}
  .btn.full{width:100%;justify-content:center}
  .grid{display:grid;gap:16px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
  .kpi .n{font-family:var(--ffd);font-size:2rem;color:var(--ink);line-height:1}
  .kpi .l{font-size:.8rem;color:var(--soft);margin-top:4px}
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);font-weight:600}
  tr:last-child td{border-bottom:none}
  .r{text-align:right}
  .tag{display:inline-block;font-size:.72rem;font-weight:600;padding:.2em .6em;border-radius:100px;background:var(--sand);color:var(--ink)}
  .tag.terra{background:var(--terra-soft);color:var(--terra-deep)}
  .tag.st{background:var(--cream);color:var(--ink)}
  .muted{color:var(--soft)}
  .link{color:var(--terra-deep);cursor:pointer;font-weight:500;background:none;border:none;font:inherit;padding:0}
  .link:hover{text-decoration:underline}
  .sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px}
  .sec-head h2{font-family:var(--ffd);font-weight:500;font-size:1.3rem;color:var(--ink)}
  .empty{padding:40px;text-align:center;color:var(--soft);font-size:.92rem}
  .rowact{display:flex;gap:6px;justify-content:flex-end}
  .iconbtn{border:none;background:none;color:var(--soft);cursor:pointer;font-size:.85rem;padding:4px 6px;border-radius:6px}
  .iconbtn:hover{background:var(--sand);color:var(--ink)}
  .iconbtn.del:hover{color:#b23}
  .facts{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:.9rem}
  .facts dt{color:var(--soft)}.facts dd{color:var(--ink)}
  .banner{background:var(--terra-soft);border:1px solid rgba(210,85,46,.2);color:var(--terra-deep);border-radius:10px;padding:11px 15px;font-size:.85rem;margin-bottom:18px}
  .modal{position:fixed;inset:0;background:rgba(26,23,16,.5);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:50;overflow:auto}
  .sheet{background:var(--paper);border-radius:16px;max-width:620px;width:100%;padding:24px 26px;border:1px solid var(--line)}
  .sheet h3{font-family:var(--ffd);font-weight:500;font-size:1.3rem;color:var(--ink);margin-bottom:16px}
  .ff{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .ff .full{grid-column:1/-1}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
  .prev-doc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px 30px}
  .prev-doc .ph{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:16px}
  .prev-doc .ph .b{font-family:var(--ffd);font-size:1.4rem;color:var(--ink)}
  .prev-doc .ph .b small{display:block;font-family:var(--ffb);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--terra);margin-top:3px}
  .tot-row{display:flex;justify-content:space-between;padding:7px 0;font-size:.92rem}
  .tot-row.big{border-top:2px solid var(--ink);margin-top:8px;padding-top:12px;font-family:var(--ffd);font-size:1.25rem;color:var(--ink)}
  .comingsoon{position:relative}.cs-badge{position:absolute;top:14px;right:14px}
  .loading{padding:60px;text-align:center;color:var(--soft)}
  @media(max-width:820px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.side-foot{display:none}.nav{flex-direction:row;flex-wrap:wrap;margin-top:0}}
  @media(max-width:560px){.ff{grid-template-columns:1fr}}
  @media print{body *{visibility:hidden}.prev-doc,.prev-doc *{visibility:visible}.modal{position:absolute;inset:0;background:#fff;padding:0}.sheet{max-width:none;border:none;padding:0}.prev-doc{border:none}.modal-actions,.sheet h3{display:none}}
</style>
</head>
<body>

<div id="setup" class="center hide">
  <div class="authcard">
    <div class="brand">Giraffa<small>Studio · CRM</small></div>
    <h2>Configurazione richiesta</h2>
    <p>Config Supabase mancante.</p>
  </div>
</div>

<div id="login" class="center hide">
  <div class="authcard">
    <div class="brand">Giraffa<small>Studio · CRM</small></div>
    <h2>Accedi</h2>
    <p>Area riservata ai membri dello studio.</p>
    <form id="loginform">
      <div class="field"><label>Email</label><input name="email" type="email" required></div>
      <div class="field"><label>Password</label><input name="password" type="password" required></div>
      <div class="err hide" id="loginerr"></div>
      <button class="btn pri full" type="submit">Entra</button>
    </form>
  </div>
</div>

<div id="app" class="app hide">
  <aside class="side">
    <div class="brand">Giraffa<small>Studio · CRM</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><span id="whoami"></span><br><button id="logout">Esci</button></div>
  </aside>
  <main class="main">
    <div class="top">
      <h1 id="ttl">Dashboard</h1>
      <div class="tools">
        <span style="font-size:.7rem;color:var(--soft)">Vista</span>
        <select id="persp"></select>
      </div>
    </div>
    <div id="main"><div class="loading">Carico i dati…</div></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.GS_CONFIG={SUPABASE_URL:"https://uxeuqyzlikkbkpraeoen.supabase.co",SUPABASE_ANON_KEY:"sb_publishable_ckqEpmyfFpsWXnK5J2-o4g_p4c_NJll"};</script>
<script>
"use strict";
var CATS=["Strategia","Brand","Social","Web","Foto","Video","Ads","Altro"];
var STATI=["Bozza","Preventivo","Approvata","In corso","Consegna","Fatturata","Chiusa","Persa"];
var MODELLI=["A · ognuno il suo","B · Giraffa fattura","C · Smart rail"];
var NAV=[["dashboard","Dashboard"],["commesse","Commesse"],["clienti","Clienti"],["pool","Pool professionisti"],["servizi","Servizi & listino"],["spazi","Spazi & ufficio"],["settings","Impostazioni"]];
var TABLE={pros:"professionisti",servizi:"servizi",clienti:"clienti",commesse:"commesse",spazi:"spazi"};
var LABELS={pros:"professionista",servizi:"servizio",clienti:"cliente",commesse:"commessa",spazi:"spazio"};

function money(n){n=Math.round(+n||0);return "€ "+n.toLocaleString("it-IT");}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function el(s){return document.querySelector(s);}
function show(id){["setup","login","app"].forEach(function(x){el("#"+x).classList.toggle("hide",x!==id);});}

var cfg=window.GS_CONFIG||{},sb=null,user=null;
var S={pros:[],servizi:[],clienti:[],commesse:[],righe:[],spazi:[],settings:{fee_default:12}};
var view="dashboard",current=null,persp="all";

function proById(id){return S.pros.filter(function(p){return p.id===id;})[0];}
function servById(id){return S.servizi.filter(function(s){return s.id===id;})[0];}
function cliById(id){return S.clienti.filter(function(c){return c.id===id;})[0];}
function komById(id){return S.commesse.filter(function(k){return k.id===id;})[0];}
function proName(id){var p=proById(id);return p?p.nome:"—";}
function cliName(id){var c=cliById(id);return c?c.nome:"—";}
function myClienti(){return persp==="all"?S.clienti:S.clienti.filter(function(c){return c.owner_id===persp;});}
function myCommesse(){return persp==="all"?S.commesse:S.commesse.filter(function(k){return k.owner_id===persp;});}
function calc(k){var imp=0,cost=0;(k.righe||[]).forEach(function(r){var s=servById(r.serv_id);if(!s)return;imp+=(+s.prezzo||0)*(r.qty||1);cost+=(+s.costo||0)*(r.qty||1);});var fee=Math.round(imp*(+k.fee||0)/100);var tot=imp+fee;return {imp:imp,cost:cost,fee:fee,tot:tot,margine:tot-cost};}

function opts(arr,val){return arr.map(function(o){var v=Array.isArray(o)?o[0]:o,t=Array.isArray(o)?o[1]:o;return '<option value="'+esc(v)+'"'+(String(v)===String(val)?" selected":"")+'>'+esc(t)+'</option>';}).join("");}
function proOpts(val){return opts(S.pros.map(function(p){return [p.id,p.nome];}),val);}
function cliOpts(val){return opts(S.clienti.map(function(c){return [c.id,c.nome];}),val);}

async function loadAll(){
  var res=await Promise.all([
    sb.from("professionisti").select("*").order("created_at"),
    sb.from("servizi").select("*").order("created_at"),
    sb.from("clienti").select("*").order("created_at"),
    sb.from("commesse").select("*").order("created_at"),
    sb.from("righe").select("*"),
    sb.from("spazi").select("*").order("created_at"),
    sb.from("settings").select("*").eq("id",1).maybeSingle()
  ]);
  var err=res.filter(function(r){return r.error;})[0];
  if(err){alert("Errore nel caricamento: "+err.error.message);}
  S.pros=res[0].data||[];S.servizi=res[1].data||[];S.clienti=res[2].data||[];
  S.commesse=res[3].data||[];S.righe=res[4].data||[];S.spazi=res[5].data||[];
  S.settings=res[6].data||{fee_default:12};
  S.commesse.forEach(function(k){k.righe=S.righe.filter(function(r){return r.commessa_id===k.id;});});
}

function vDashboard(){
  var ks=myCommesse();
  var attive=ks.filter(function(k){return ["Bozza","Preventivo","Approvata","In corso","Consegna"].indexOf(k.stato)>=0;});
  var pipeline=attive.reduce(function(a,k){return a+calc(k).tot;},0);
  var provATT=S.pros.filter(function(p){return p.vetting==="Attivo";}).length;
  var kpi=[[ks.length,"Commesse"],[money(pipeline),"Valore pipeline"],[myClienti().length,"Clienti"],[provATT,"Professionisti attivi"]];
  var rows=ks.slice().reverse().slice(0,6).map(function(k){var c=calc(k);return '<tr><td><button class="link" data-act="open" data-id="'+k.id+'">'+esc(k.titolo)+'</button></td><td>'+esc(cliName(k.cliente_id))+'</td><td><span class="tag st">'+esc(k.stato)+'</span></td><td>'+esc(proName(k.owner_id))+'</td><td class="r">'+money(c.tot)+'</td></tr>';}).join("");
  return '<div class="grid kpis">'+kpi.map(function(x){return '<div class="card kpi"><div class="n">'+x[0]+'</div><div class="l">'+x[1]+'</div></div>';}).join("")+'</div>'+
  '<div class="card" style="margin-top:18px"><div class="sec-head"><h2>Commesse recenti</h2><button class="btn pri sm" data-act="new-commesse">+ Nuova commessa</button></div>'+
  (ks.length?'<table><thead><tr><th>Commessa</th><th>Cliente</th><th>Stato</th><th>Owner</th><th class="r">Totale</th></tr></thead><tbody>'+rows+'</tbody></table>':'<div class="empty">Nessuna commessa. Creane una per iniziare.</div>')+'</div>';
}
function vCommesse(){
  var ks=myCommesse();
  var rows=ks.slice().reverse().map(function(k){var c=calc(k);return '<tr><td><button class="link" data-act="open" data-id="'+k.id+'">'+esc(k.titolo)+'</button></td><td>'+esc(cliName(k.cliente_id))+'</td><td><span class="tag st">'+esc(k.stato)+'</span></td><td>'+esc((k.modello||"").split(" ")[0])+'</td><td>'+esc(proName(k.owner_id))+'</td><td class="r">'+money(c.tot)+'</td></tr>';}).join("");
  return '<div class="card"><div class="sec-head"><h2>Commesse</h2><button class="btn pri sm" data-act="new-commesse">+ Nuova commessa</button></div>'+
  (ks.length?'<table><thead><tr><th>Titolo</th><th>Cliente</th><th>Stato</th><th>Fatt.</th><th>Owner</th><th class="r">Totale</th></tr></thead><tbody>'+rows+'</tbody></table>':'<div class="empty">Nessuna commessa.</div>')+'</div>';
}
function vCommessa(){
  var k=komById(current);if(!k)return vCommesse();
  var c=calc(k);
  var righe=(k.righe||[]).map(function(r){var s=servById(r.serv_id);if(!s)return "";return '<tr><td>'+esc(s.nome)+' <span class="muted">· '+esc(s.cat)+'</span></td><td>'+esc(proName(s.pro_id))+'</td><td class="r">'+(r.qty||1)+'</td><td class="r muted">'+money(s.costo*(r.qty||1))+'</td><td class="r">'+money(s.prezzo*(r.qty||1))+'</td><td class="r"><button class="iconbtn del" data-act="del-riga" data-id="'+r.id+'">Rimuovi</button></td></tr>';}).join("");
  return '<button class="link" data-act="nav" data-id="commesse" style="margin-bottom:12px">&larr; Tutte le commesse</button>'+
  '<div class="grid" style="grid-template-columns:1.6fr 1fr">'+
    '<div class="card"><div class="sec-head"><h2>'+esc(k.titolo)+'</h2><button class="btn ghost sm" data-act="edit-commesse" data-id="'+k.id+'">Modifica</button></div>'+
      '<div class="sec-head" style="margin:14px 0 8px"><h2 style="font-size:1rem">Righe (servizi)</h2><button class="btn sm" data-act="add-riga" data-id="'+k.id+'">+ Aggiungi servizio</button></div>'+
      (righe?'<table><thead><tr><th>Servizio</th><th>Professionista</th><th class="r">Q.tà</th><th class="r">Costo</th><th class="r">Prezzo</th><th></th></tr></thead><tbody>'+righe+'</tbody></table>':'<div class="empty">Nessun servizio. Aggiungine uno dal pool.</div>')+
    '</div>'+
    '<div class="grid">'+
      '<div class="card"><dl class="facts"><dt>Cliente</dt><dd>'+esc(cliName(k.cliente_id))+'</dd><dt>Owner</dt><dd>'+esc(proName(k.owner_id))+'</dd><dt>Regia</dt><dd>'+esc(proName(k.pm_id))+'</dd><dt>Stato</dt><dd><span class="tag st">'+esc(k.stato)+'</span></dd><dt>Fatturazione</dt><dd>'+esc(k.modello||"—")+'</dd></dl></div>'+
      '<div class="card"><div class="tot-row"><span>Imponibile servizi</span><b>'+money(c.imp)+'</b></div><div class="tot-row"><span>Fee coordinamento ('+(+k.fee||0)+'%)</span><b>'+money(c.fee)+'</b></div><div class="tot-row big"><span>Totale cliente</span><span>'+money(c.tot)+'</span></div><div class="tot-row muted" style="margin-top:8px"><span>Costo ai professionisti</span><span>'+money(c.cost)+'</span></div><div class="tot-row muted"><span>Margine studio</span><span>'+money(c.margine)+'</span></div>'+
      '<div style="display:flex;gap:8px;margin-top:14px"><button class="btn pri sm" data-act="preventivo" data-id="'+k.id+'">Preventivo</button><button class="btn sm" data-act="portale" data-id="'+k.id+'">Vista cliente</button></div></div>'+
    '</div>'+
  '</div>';
}
function vClienti(){
  var cs=myClienti();
  var rows=cs.slice().reverse().map(function(c){var n=S.commesse.filter(function(k){return k.cliente_id===c.id;}).length;return '<tr><td><b>'+esc(c.nome)+'</b></td><td>'+esc(c.settore||"—")+'</td><td>'+esc(proName(c.owner_id))+'</td><td><span class="tag st">'+esc(c.stato)+'</span></td><td class="r">'+n+'</td><td><div class="rowact"><button class="iconbtn" data-act="edit-clienti" data-id="'+c.id+'">Modifica</button><button class="iconbtn del" data-act="del-clienti" data-id="'+c.id+'">Elimina</button></div></td></tr>';}).join("");
  return '<div class="card"><div class="sec-head"><h2>Clienti</h2><button class="btn pri sm" data-act="new-clienti">+ Nuovo cliente</button></div>'+
  (cs.length?'<table><thead><tr><th>Nome</th><th>Settore</th><th>Owner</th><th>Stato</th><th class="r">Commesse</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>':'<div class="empty">Nessun cliente.</div>')+'</div>';
}
function vPool(){
  var rows=S.pros.map(function(p){var ns=S.servizi.filter(function(s){return s.pro_id===p.id;}).length;return '<tr><td><b>'+esc(p.nome)+'</b></td><td>'+esc(p.ruolo||"—")+'</td><td class="muted">'+esc(p.competenze||"—")+'</td><td><span class="tag '+(p.vetting==="Attivo"?"terra":"st")+'">'+esc(p.vetting)+'</span></td><td class="r">'+ns+'</td><td><div class="rowact"><button class="iconbtn" data-act="edit-pros" data-id="'+p.id+'">Modifica</button><button class="iconbtn del" data-act="del-pros" data-id="'+p.id+'">Elimina</button></div></td></tr>';}).join("");
  return '<div class="card"><div class="sec-head"><h2>Pool professionisti</h2><button class="btn pri sm" data-act="new-pros">+ Nuovo professionista</button></div>'+
  (S.pros.length?'<table><thead><tr><th>Nome</th><th>Ruolo</th><th>Competenze</th><th>Vetting</th><th class="r">Servizi</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>':'<div class="empty">Nessun professionista.</div>')+'</div>';
}
function vServizi(){
  var rows=S.servizi.map(function(s){return '<tr><td><b>'+esc(s.nome)+'</b></td><td><span class="tag st">'+esc(s.cat)+'</span></td><td>'+esc(proName(s.pro_id))+'</td><td class="muted">'+esc(s.unita||"—")+'</td><td class="r muted">'+money(s.costo)+'</td><td class="r">'+money(s.prezzo)+'</td><td><div class="rowact"><button class="iconbtn" data-act="edit-servizi" data-id="'+s.id+'">Modifica</button><button class="iconbtn del" data-act="del-servizi" data-id="'+s.id+'">Elimina</button></div></td></tr>';}).join("");
  return '<div class="banner"><b>Costo</b> = compenso al professionista · <b>Prezzo</b> = prezzo al cliente. Il cliente vede solo il prezzo.</div>'+
  '<div class="card"><div class="sec-head"><h2>Servizi & listino</h2><button class="btn pri sm" data-act="new-servizi">+ Nuovo servizio</button></div>'+
  (S.servizi.length?'<table><thead><tr><th>Servizio</th><th>Categoria</th><th>Professionista</th><th>Unità</th><th class="r">Costo</th><th class="r">Prezzo</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>':'<div class="empty">Nessun servizio.</div>')+'</div>';
}
function vSpazi(){
  var cards=S.spazi.map(function(x){return '<div class="card comingsoon">'+(x.stato==="Coming soon"?'<span class="tag terra cs-badge">Coming soon</span>':'')+'<h2 style="font-family:var(--ffd);font-weight:500;font-size:1.15rem;color:var(--ink)">'+esc(x.nome)+'</h2><dl class="facts" style="margin-top:10px"><dt>Luogo</dt><dd>'+esc(x.indirizzo||"—")+'</dd><dt>Tipo</dt><dd>'+esc(x.tipo||"—")+'</dd><dt>Opzioni</dt><dd>'+esc(x.opzioni||"—")+'</dd><dt>Costo</dt><dd>'+esc(x.costo||"—")+'</dd></dl><div class="rowact" style="margin-top:12px"><button class="iconbtn" data-act="edit-spazi" data-id="'+x.id+'">Modifica</button><button class="iconbtn del" data-act="del-spazi" data-id="'+x.id+'">Elimina</button></div></div>';}).join("");
  return '<div class="banner">Modulo <b>Spazi & ufficio</b> in preparazione. Già pronto per più coworking partner con opzioni e costi diversi.</div>'+
  '<div class="sec-head"><h2 style="font-family:var(--ffd);font-weight:500">Spazi partner</h2><button class="btn pri sm" data-act="new-spazi">+ Nuovo spazio</button></div>'+
  '<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">'+(cards||'<div class="empty">Nessuno spazio.</div>')+'</div>';
}
function vSettings(){
  return '<div class="card" style="max-width:520px"><div class="sec-head"><h2>Impostazioni</h2></div>'+
  '<form data-form="settings"><label>Fee di coordinamento predefinita (%)</label><input name="fee_default" type="number" value="'+(+S.settings.fee_default||0)+'" style="width:120px"><div class="modal-actions" style="justify-content:flex-start"><button class="btn pri sm" type="submit">Salva</button></div></form>'+
  '<p class="muted" style="font-size:.85rem;margin-top:16px">Dati condivisi su Supabase. I membri si gestiscono dalla dashboard Supabase (Authentication &rarr; Users).</p></div>';
}
var VIEWS={dashboard:vDashboard,commesse:vCommesse,commessa:vCommessa,clienti:vClienti,pool:vPool,servizi:vServizi,spazi:vSpazi,settings:vSettings};
var TITLES={dashboard:"Dashboard",commesse:"Commesse",commessa:"Commessa",clienti:"Clienti",pool:"Pool professionisti",servizi:"Servizi & listino",spazi:"Spazi & ufficio",settings:"Impostazioni"};

var FIELDS={
  pros:[["nome","Nome","text"],["ruolo","Ruolo","text"],["competenze","Competenze","text"],["vetting","Vetting",["In valutazione","Attivo"]],["rating","Rating (1-5)","number"]],
  servizi:[["pro_id","Professionista","proref"],["nome","Servizio","text"],["cat","Categoria",CATS],["unita","Unità (es. progetto, mese)","text"],["costo","Compenso al professionista €","number"],["prezzo","Prezzo al cliente €","number"]],
  clienti:[["nome","Nome","text"],["owner_id","Owner (chi lo porta)","proref"],["settore","Settore","text"],["email","Email","text"],["stato","Stato",["Lead","Attivo","Chiuso"]]],
  commesse:[["titolo","Titolo","text"],["cliente_id","Cliente","cliref"],["owner_id","Owner","proref"],["pm_id","Regia / PM","proref"],["stato","Stato",STATI],["modello","Modello fatturazione",MODELLI],["fee","Fee coordinamento %","number"],["note","Note","textarea"]],
  spazi:[["nome","Nome spazio","text"],["indirizzo","Luogo","text"],["tipo","Tipo postazione","text"],["opzioni","Opzioni","text"],["costo","Costo","text"],["stato","Stato",["Coming soon","Attivo"]]]
};
function field(f,rec){
  var name=f[0],lab=f[1],type=f[2];var val=rec?rec[name]:"";
  var full=(type==="textarea")?" full":"";var inp;
  if(type==="proref")inp='<select name="'+name+'">'+proOpts(val)+'</select>';
  else if(type==="cliref")inp='<select name="'+name+'">'+cliOpts(val)+'</select>';
  else if(Array.isArray(type))inp='<select name="'+name+'">'+opts(type,val)+'</select>';
  else if(type==="textarea")inp='<textarea name="'+name+'" rows="2">'+esc(val)+'</textarea>';
  else inp='<input name="'+name+'" type="'+type+'" value="'+esc(val)+'">';
  return '<div class="'+(full?"full":"")+'"><label>'+esc(lab)+'</label>'+inp+'</div>';
}
function openForm(entity,id){
  var rec=id?S[entity].filter(function(x){return x.id===id;})[0]:null;
  var body='<form data-form="'+entity+'"'+(id?' data-id="'+id+'"':"")+'><div class="ff">'+FIELDS[entity].map(function(f){return field(f,rec);}).join("")+'</div><div class="modal-actions"><button type="button" class="btn ghost sm" data-act="close">Annulla</button><button type="submit" class="btn pri sm">Salva</button></div></form>';
  openModal((id?"Modifica ":"Nuovo/a ")+LABELS[entity],body);
}
async function handleForm(f){
  var entity=f.dataset.form;
  if(entity==="settings"){var r=await sb.from("settings").update({fee_default:+f.fee_default.value||0}).eq("id",1);if(r.error){alert(r.error.message);return;}await loadAll();closeModal();render();return;}
  var id=f.dataset.id,payload={};
  FIELDS[entity].forEach(function(fl){var n=fl[0],ty=fl[2];var v=f[n]?f[n].value:"";if(ty==="number")v=+v||0;payload[n]=v;});
  var table=TABLE[entity],newId=null,error;
  if(id){var u=await sb.from(table).update(payload).eq("id",id);error=u.error;}
  else{var ins=await sb.from(table).insert(payload).select().single();error=ins.error;if(!error)newId=ins.data.id;}
  if(error){alert("Errore: "+error.message);return;}
  await loadAll();closeModal();
  if(entity==="commesse"&&newId){current=newId;view="commessa";}
  render();
}

function openRiga(kid){
  if(!S.servizi.length){alert("Aggiungi prima un servizio nel Pool / Servizi.");return;}
  var body='<form data-riga="'+kid+'"><div class="ff"><div class="full"><label>Servizio (dal pool)</label><select name="serv">'+S.servizi.map(function(s){return '<option value="'+s.id+'">'+esc(s.nome)+' — '+esc(proName(s.pro_id))+' ('+money(s.prezzo)+')</option>';}).join("")+'</select></div><div><label>Quantità</label><input name="qty" type="number" value="1" min="1"></div></div><div class="modal-actions"><button type="button" class="btn ghost sm" data-act="close">Annulla</button><button type="submit" class="btn pri sm">Aggiungi</button></div></form>';
  openModal("Aggiungi servizio alla commessa",body);
}
async function handleRiga(f){
  var r=await sb.from("righe").insert({commessa_id:f.dataset.riga,serv_id:f.serv.value,qty:+f.qty.value||1});
  if(r.error){alert(r.error.message);return;}
  await loadAll();closeModal();render();
}

function openPreventivo(kid){
  var k=komById(kid);if(!k)return;var c=calc(k);
  var rows=(k.righe||[]).map(function(r){var s=servById(r.serv_id);if(!s)return "";return '<div class="tot-row"><span>'+esc(s.nome)+(r.qty>1?" × "+r.qty:"")+'</span><b>'+money(s.prezzo*(r.qty||1))+'</b></div>';}).join("");
  var doc='<div class="prev-doc"><div class="ph"><div class="b">Giraffa<small>Studio</small></div><div style="text-align:right;font-size:.82rem;color:var(--soft)">Preventivo<br>'+new Date().toLocaleDateString("it-IT")+'</div></div>'+
    '<div style="font-size:.9rem;margin-bottom:14px"><b style="color:var(--ink)">'+esc(cliName(k.cliente_id))+'</b> · '+esc(k.titolo)+'</div>'+rows+
    '<div class="tot-row"><span>Coordinamento studio</span><b>'+money(c.fee)+'</b></div>'+
    '<div class="tot-row big"><span>Totale</span><span>'+money(c.tot)+'</span></div>'+
    '<p style="font-size:.72rem;color:var(--soft);margin-top:14px">Giraffa Studio · Verona · un unico partner, la squadra giusta per il tuo progetto. Importi IVA esclusa.</p></div>';
  openModal("Preventivo a nome Giraffa",doc+'<div class="modal-actions"><button type="button" class="btn ghost sm" data-act="close">Chiudi</button><button type="button" class="btn pri sm" data-act="print">Stampa / PDF</button></div>');
}
function openPortale(kid){
  var k=komById(kid);if(!k)return;var c=calc(k);var team={};
  (k.righe||[]).forEach(function(r){var s=servById(r.serv_id);if(s)team[proName(s.pro_id)]=1;});
  var piano=(k.righe||[]).map(function(r){var s=servById(r.serv_id);if(!s)return "";return '<div class="tot-row"><span>'+esc(s.nome)+' <span class="muted">· '+esc(s.cat)+'</span></span><b>'+money(s.prezzo*(r.qty||1))+'</b></div>';}).join("");
  var body='<div class="banner">Ciò che vede il cliente: piano, avanzamento e totale. Mai costi né split interni.</div>'+
    '<div class="card"><dl class="facts"><dt>Progetto</dt><dd>'+esc(k.titolo)+'</dd><dt>Stato</dt><dd><span class="tag st">'+esc(k.stato)+'</span></dd><dt>Il tuo team</dt><dd>'+esc(Object.keys(team).join(", ")||"—")+'</dd></dl>'+
    '<h2 style="font-family:var(--ffd);font-weight:500;font-size:1.05rem;margin:16px 0 6px;color:var(--ink)">Piano</h2>'+(piano||'<span class="muted">—</span>')+'<div class="tot-row big"><span>Totale</span><span>'+money(c.tot)+'</span></div></div>';
  openModal("Portale cliente (anteprima)",body+'<div class="modal-actions"><button type="button" class="btn pri sm" data-act="close">Chiudi</button></div>');
}

function openModal(title,body){
  var m=document.createElement("div");m.className="modal";m.id="modal";
  m.innerHTML='<div class="sheet"><h3>'+esc(title)+'</h3>'+body+'</div>';
  m.addEventListener("click",function(e){if(e.target===m)closeModal();});
  document.body.appendChild(m);
}
function closeModal(){var m=el("#modal");if(m)m.remove();}

function render(){
  el("#ttl").textContent=TITLES[view]||"Giraffa Studio";
  el("#main").innerHTML=(VIEWS[view]||vDashboard)();
  Array.prototype.forEach.call(document.querySelectorAll("#nav button"),function(b){b.classList.toggle("on",b.dataset.id===view||(view==="commessa"&&b.dataset.id==="commesse"));});
}
function buildChrome(){
  el("#nav").innerHTML=NAV.map(function(n){return '<button data-act="nav" data-id="'+n[0]+'">'+esc(n[1])+'</button>';}).join("");
  el("#whoami").textContent=user?user.email:"";
  el("#persp").innerHTML='<option value="all">Tutto lo studio</option>'+S.pros.map(function(p){return '<option value="'+p.id+'">'+esc(p.nome)+'</option>';}).join("");
  el("#persp").value=persp;
}

document.addEventListener("click",async function(e){
  var t=e.target.closest("[data-act]");if(!t)return;
  var a=t.dataset.act,id=t.dataset.id;
  if(a==="nav"){view=id;current=null;render();window.scrollTo(0,0);return;}
  if(a==="open"){current=id;view="commessa";render();window.scrollTo(0,0);return;}
  if(a==="close"){closeModal();return;}
  if(a==="print"){window.print();return;}
  if(a==="add-riga"){openRiga(id);return;}
  if(a==="del-riga"){if(confirm("Rimuovere il servizio?")){var d=await sb.from("righe").delete().eq("id",id);if(d.error){alert(d.error.message);return;}await loadAll();render();}return;}
  if(a==="preventivo"){openPreventivo(id);return;}
  if(a==="portale"){openPortale(id);return;}
  var m=a.match(/^(new|edit|del)-([a-z]+)$/);
  if(m){
    var op=m[1],ent=m[2];
    if(op==="new"){openForm(ent);}
    else if(op==="edit"){openForm(ent,id);}
    else if(op==="del"){if(confirm("Eliminare definitivamente?")){var r=await sb.from(TABLE[ent]).delete().eq("id",id);if(r.error){alert(r.error.message);return;}if(view==="commessa")view="commesse";await loadAll();render();}}
  }
});
document.addEventListener("submit",function(e){
  var f=e.target;
  if(f.id==="loginform"){e.preventDefault();doLogin(f);return;}
  if(f.dataset.form){e.preventDefault();handleForm(f);return;}
  if(f.dataset.riga){e.preventDefault();handleRiga(f);return;}
});
document.addEventListener("change",function(e){
  if(e.target.id==="persp"){persp=e.target.value;if(view==="commessa"){view="commesse";current=null;}render();}
});
el("#logout").addEventListener("click",async function(){await sb.auth.signOut();location.reload();});

async function doLogin(f){
  var err=el("#loginerr");err.classList.add("hide");
  var r=await sb.auth.signInWithPassword({email:f.email.value,password:f.password.value});
  if(r.error){err.textContent=r.error.message;err.classList.remove("hide");return;}
  await start();
}
async function start(){
  var s=await sb.auth.getSession();var session=s.data.session;
  if(!session){show("login");return;}
  user=session.user;
  await loadAll();buildChrome();render();show("app");
}
async function init(){
  if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY){show("setup");return;}
  sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
  await start();
}
init();
</script>
</body>
</html>
